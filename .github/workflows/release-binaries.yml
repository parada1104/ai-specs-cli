name: Release binaries

# Builds the ai-specs CLI for every supported target on tag push, verifies the
# binaries against the committed CLI trust root, and attaches those assets to
# the GitHub release. The worktree gate ships inside the CLI; it has no separate
# release assets or checksum trust root. Its parity corpus moves to T8.
#
# Invariants:
#   - four supported targets: darwin/arm64, darwin/amd64, linux/amd64, linux/arm64
#   - reproducible builds: CGO_ENABLED=0, -trimpath, -buildvcs=false
#   - the toolchain is pinned to go 1.24.13, which generated bin/SHA256SUMS;
#     scripts/build-cli.sh uses the same version to reproduce the CLI assets
#   - no binaries are committed; bin/SHA256SUMS is the CLI release manifest

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-cli:
    name: Build ai-specs CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # bin/SHA256SUMS is regenerated with exactly go1.24.13; the
          # checksum gate compares the built bytes against it.
          go-version: "1.24.13"

      - name: Run go vet
        run: go vet ./cmd/... ./internal/...

      - name: Run go test
        run: go test ./cmd/... ./internal/...

      - name: Build target
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -buildvcs=false \
            -o "dist/ai-specs-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/ai-specs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-specs-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/ai-specs-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  checksum:
    name: Emit and verify SHA256SUMS
    needs: [build-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Emit SHA256SUMS
        working-directory: dist
        run: |
          sha256sum ai-specs-* > CLI-SHA256SUMS

      - name: Compare with committed CLI digests (canonical)
        # The same contract for the CLI trust root: install.sh and
        # `ai-specs upgrade` read bin/SHA256SUMS, so an asset whose digest
        # differs from it would never install — the release would be useless
        # and misleading at once.
        run: |
          if ! bash scripts/verify-cli-sums.sh dist/CLI-SHA256SUMS bin/SHA256SUMS; then
            echo "error: built digests differ from the committed bin/SHA256SUMS;" \
                 "regenerate bin/SHA256SUMS with scripts/build-cli.sh and commit it" >&2
            exit 1
          fi

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ai-specs-*
