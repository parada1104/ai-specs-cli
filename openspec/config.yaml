schema: spec-driven

context: |
  Tech stack: Bash CLI entrypoints with Python 3.11+ helpers and unittest-based tests.
  Architecture: bin/ai-specs dispatches to lib/*.sh and lib/_internal/*.py; templates and bundled assets generate agent outputs.
  Testing: ./tests/run.sh runs unittest discovery; ./tests/validate.sh adds py_compile and bash -n checks.
  Style: Generated agent files are derived artifacts; AGENTS.md is auto-generated and ai-specs/ai-specs.toml is the source of truth.

strict_tdd: true

testing:
  detected: 2026-04-24
  test_runner:
    available: true
    framework: unittest
    command: ./tests/run.sh
  layers:
    unit:
      available: true
      tool: unittest
    integration:
      available: false
      tool: ""
    e2e:
      available: false
      tool: ""
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: false
      command: ""
    type_checker:
      available: false
      command: ""
    formatter:
      available: false
      command: ""
  validation:
    command: ./tests/validate.sh
    notes:
      - python3 -m py_compile lib/_internal/*.py tests/*.py
      - bash -n lib/*.sh bin/ai-specs tests/*.sh
      - ./tests/run.sh

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
    - Include README update task when the change affects CLI commands, manifest schema, or user-facing behavior
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    - Use ./tests/run.sh for focused test feedback during implementation
    - Record RED/GREEN evidence when strict TDD applies
    - Update README when the change touches CLI commands, manifest schema, or user-facing docs
    - Prefer git commits grouped by tasks.md phase; avoid a single end-of-branch squash unless recovering history
  verify:
    - Run ./tests/validate.sh before final verification
    - Compare implementation against every spec scenario
    - State unavailable quality signals explicitly, including coverage, linter, type-checker, and formatter

sdd:
  mode: adaptive
  # Canonical ceremony levels from openspec/specs/sdd-adaptive-contract/spec.md.
  # Informal practice aliases: light≈trivial/local_fix, standard≈behavior_change,
  # full≈domain_change, tasks-only≈behavior_change without proposal/design.
  decision_matrix:
    trivial:
      artifacts: []
      worktree_required: false
      proposal_required: false
      design_required: false
    local_fix:
      artifacts: ["code", "tests"]
      worktree_required: false
      proposal_required: false
      design_required: false
    behavior_change:
      artifacts: ["specs", "tasks.md", "code", "tests"]
      worktree_required: true
      proposal_required: false
      design_required: false
    domain_change:
      artifacts:
        - "proposal.md"
        - "specs"
        - "design.md"
        - "tasks.md"
        - "apply-report"
        - "verify-report"
        - "archive-report"
      worktree_required: true
      proposal_required: true
      design_required: true

ai_specs_guidance:
  sdd:
    use_subagents: true
  apply:
    tdd: true
    test_command: ./tests/run.sh
  verify:
    test_command: ./tests/validate.sh
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)

# Soft guidance for SDD phase agents (file-format dependency only; not read by
# ai-specs bin/lib). Doctor/gate keep reading operational gate_mode/board_id
# from recipe config in ai-specs.toml.
tracking:
  tracker: trello
  board_id: "69ec097f13e2d38ecd89a557"
  artifact_section: "## Tracker"
  required_fields: [card_id, url]
  gate_mode: warn
