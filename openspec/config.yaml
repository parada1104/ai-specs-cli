schema: spec-driven

context: |
  Tech stack: Go CLI (module ai-specs.dev/ai-specs). cmd/ai-specs is the
  entrypoint; internal/* holds the verbs, the gate guardian and the sync engine.
  Architecture: one Go binary. internal/gates is the read-only pre-merge
  guardian, internal/planbuild owns change/plan/config resolution, and
  catalog/ carries the recipes, skills and templates that sync materializes
  into a project.
  Testing: go test ./internal/... is the focused loop; ./tests/validate.sh is
  the full validation entrypoint.
  Parity baseline: ./tests/run.sh still runs the legacy Python/Bash suite, where
  known parity failures remain. A failure there is a baseline note, not a
  regression of the Go suite.
  Style: generated agent files are derived artifacts; AGENTS.md is
  auto-generated and ai-specs/ai-specs.toml is the source of truth.

strict_tdd: true

testing:
  detected: 2026-04-24
  runner: go test ./internal/...
  focused: >
    go test ./internal/gates/... ./internal/planbuild/... ./internal/cli/...
    -count=1
  validation: ./tests/validate.sh
  parity_baseline: ./tests/run.sh

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
    - Include README update task when the change affects CLI commands, manifest schema, or user-facing behavior
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    - Use go test ./internal/<package> -count=1 for focused test feedback during
      implementation
    - Record RED/GREEN evidence when strict TDD applies
    - Update README when the change touches CLI commands, manifest schema, or user-facing docs
    - Prefer git commits grouped by plan task; avoid a single end-of-branch
      squash unless recovering history
  verify:
    - Run ./tests/validate.sh before final verification
    - Compare implementation against every spec scenario
    - State unavailable quality signals explicitly, including coverage, linter, type-checker, and formatter

ai_specs_guidance:
  apply:
    tdd: true
    test_command: go test ./internal/...
  verify:
    test_command: ./tests/validate.sh
    build_command: go build ./cmd/ai-specs
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)

# Declared tracking metadata; board_id and gate_mode are consistency-pinned
# against operational recipe config in ai-specs/ai-specs.toml, not enforcement.
# The tracking block is a declaration for SDD phase agents and file-format consumers.
tracking:
  tracker: trello
  board_id: "69ec097f13e2d38ecd89a557"
  artifact_section: "## Tracker"
  # Fields recorded when linking; validity is non-empty card_id. Missing url is an INFO nudge, never a validity block.
  required_fields: [card_id, url]
  gate_mode: warn
