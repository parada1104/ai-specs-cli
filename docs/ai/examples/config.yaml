# OpenSpec configuration (spec-driven schema)
#
# This is a full example of openspec/config.yaml used by the ai-specs
# SDD integration. See docs/ai/sdd.md for the provider contract.

# -----------------------------------------------------------------------------
# Top-level schema selection.
# ai-specs v1 always uses "spec-driven".
# -----------------------------------------------------------------------------
schema: spec-driven

# -----------------------------------------------------------------------------
# Tools — comma-separated list of agents to target for skill generation.
# Must match the agents declared in ai-specs/ai-specs.toml [agents].enabled.
# -----------------------------------------------------------------------------
tools: claude, cursor, opencode

# -----------------------------------------------------------------------------
# Guidance — rules and conventions applied during OpenSpec workflows.
# -----------------------------------------------------------------------------
guidance:
  # Commit conventions during SDD apply.
  commit-conventions: |
    - Use conventional commits (feat:, fix:, chore:, docs:)
    - Reference the change ID in the commit message
    - Keep apply commits focused on a single task

  # Verification expectations.
  verify: |
    - Run the project's test suite
    - Confirm all task artifacts are complete
    - Check that generated code matches the design

  # Archive rules.
  archive: |
    - Move the change directory under archive/
    - Sync delta specs to the main specs/ directory
    - Do not delete the original tasks or design files
