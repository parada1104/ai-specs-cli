[recipe]
id = "vault-canonical-store"
name = "Vault Canonical Store"
description = "Durable decisions and handoffs in a configured vault MCP (e.g. Obsidian / filesystem)"
version = "1.1.0"
author = "ai-specs"
license = "MIT"

[[capabilities]]
id = "canonical-store"

[[hooks]]
event = "on-sync"
action = "validate-config"

[config.vault_scope]
required = false
type = "string"

[config.decisions_folder]
required = false
type = "string"
default = "decisiones"

[config.sessions_folder]
required = false
type = "string"
default = "sessions"

[provides]
skills = [{ id = "vault-context", source = "bundled" }]

[[provides.brief.context_sources]]
key = "vault-canonical-note-taker"
text = "Vault is the canonical note-taker for decisions, handoffs, and structured project context."

[[provides.brief.mcp_descriptions]]
key = "vault-canonical"
text = "Canonical project notes in the vault (scoped to the project path)."

# Canonical store served over the filesystem MCP. The project's .envrc owns the
# full scoped path (e.g. CANONICAL_VAULT_PATH="$OBSIDIAN_VAULT_PATH/<scope>");
# the preset stays static. Vars referenced in args use ${VAR} and are declared
# as env passthrough so every harness resolves them.
# Version pinned: 2025.7.29+ replaces argv dirs with MCP client roots when the
# client advertises the roots capability (omp/pi do), which silently re-scopes
# the server to the project cwd instead of the vault.
[[provides.mcp]]
id = "vault-canonical"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem@2025.7.1", "${CANONICAL_VAULT_PATH}"]
env = { CANONICAL_VAULT_PATH = "$CANONICAL_VAULT_PATH" }
timeout = 30000

[[provides.docs]]
source = "README.md"
target = "ai-specs/recipes/vault-canonical-store/README.md"
