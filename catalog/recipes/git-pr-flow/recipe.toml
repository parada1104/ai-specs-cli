[recipe]
id = "git-pr-flow"
name = "Git PR Flow"
description = "GitHub PR and merge flow for feature branches (via gh CLI)"
version = "1.4.1"
author = "ai-specs"
license = "MIT"
tags = ["vcs", "github"]

[[capabilities]]
id = "vcs-pr-flow"

[[hooks]]
event = "on-sync"
action = "validate-config"

[[deps.cli]]
binary = "gh"
purpose = "Create and manage GitHub pull requests"
required = true
install_url = "https://cli.github.com/"
version_check = "gh --version"
min_version = "2.0.0"

[config.base_branch]
required = false
type = "string"
default = "main"
help_text = "Integration/base branch for PRs (e.g. main or development). PRs target this branch."

[config.expected_owner]
required = false
type = "string"
default = ""
help_text = "GitHub org or user that should own the remote (for multi-account gh). Leave empty to skip owner checks. See: gh auth status / gh auth switch."

[config.auto_switch_account]
required = false
type = "bool"
default = false
help_text = "If true, try gh auth switch when the active account does not match expected_owner. Requires gh CLI: https://cli.github.com/"

[provides]
skills = [{ id = "git-merge-workflow", source = "bundled" }]
commands = [{ id = "pr-create", path = "commands/pr-create.md" }]

[provides.brief]
workflow_rules = [
    "Use a PR-based merge workflow; all changes to `{config.base_branch}` go through a pull request.",
    "VCS/PR provider: GitHub (gh CLI). Use gh for all PR operations.",
    "Do not push directly to `{config.base_branch}`; always open a PR from a feature branch.",
    "After a merged PR, remove the feature worktree and delete the local branch (`git branch -D` after squash); delete the remote branch if it still exists.",
]

[[provides.docs]]
source = "README.md"
target = "ai-specs/recipes/git-pr-flow/README.md"

[[provides.templates]]
source = "templates/premerge_guardian.py"
target = "ai-specs/bin/premerge_guardian.py"
condition = "not_exists"
