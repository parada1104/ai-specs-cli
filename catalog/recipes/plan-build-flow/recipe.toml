[recipe]
id = "plan-build-flow"
name = "Plan / Build Flow"
description = "Ambient change workflow: silent planning artifacts before implementation, then validate and close"
version = "2.0.0"
author = "ai-specs"
license = "MIT"
tags = ["workflow"]

[[capabilities]]
id = "plan-build-flow"

[[hooks]]
event = "on-sync"
action = "validate-config"

[provides]
skills = [{ id = "plan-build-flow", source = "bundled" }]

[provides.brief]
workflow_rules = [
    "For substantial changes, produce reviewable planning artifacts before writing production code; stop and wait for human authorization.",
    "After authorization, implement, validate, and close the change in one flow — archive timing follows the bound VCS merge workflow.",
    "Run file-writing implementation inside the change worktree when isolated worktrees are enabled.",
]

[[provides.docs]]
source = "README.md"
target = "ai-specs/recipes/plan-build-flow/README.md"
