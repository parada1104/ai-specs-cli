[recipe]
id = "gitlab-mr-flow"
name = "GitLab MR Flow"
description = "Provider-oriented MR and merge flow for feature branches (GitLab via glab CLI)"
version = "1.0.0"
author = "ai-specs"
license = "MIT"

[[capabilities]]
id = "vcs-pr-flow"

[[hooks]]
event = "on-sync"
action = "validate-config"

[config.provider]
required = false
type = "string"
default = "gitlab"

[config.base_branch]
required = false
type = "string"
default = "development"

[provides]
skills = [{ id = "gitlab-merge-workflow", source = "bundled" }]
commands = [{ id = "mr-create", path = "commands/mr-create.md" }]

[provides.brief]
workflow_rules = [
    "Use a MR-based merge workflow; all changes to `{config.base_branch}` go through a merge request.",
    "VCS/MR provider: `{config.provider}`. Use the provider CLI for all MR operations.",
    "Do not push directly to `{config.base_branch}`; always open an MR from a feature branch.",
]

[[provides.docs]]
source = "README.md"
target = "ai-specs/recipes/gitlab-mr-flow/README.md"
