[recipe]
id = "gitlab-mr-flow"
name = "GitLab MR Flow"
description = "GitLab MR and merge flow for feature branches (via glab CLI)"
version = "1.2.0"
author = "ai-specs"
license = "MIT"
tags = ["vcs", "gitlab"]

[[capabilities]]
id = "vcs-pr-flow"

[[hooks]]
event = "on-sync"
action = "validate-config"

[[deps.cli]]
binary = "glab"
purpose = "Create and manage GitLab merge requests"
required = true
install_url = "https://gitlab.com/gitlab-org/cli#installation"
version_check = "glab --version"
min_version = "1.0.0"

[[deps.cli]]
binary = "jq"
purpose = "Parse GitLab API JSON responses in the MR flow"
required = true
install_url = "https://jqlang.github.io/jq/download/"

[config.base_branch]
required = false
type = "string"
default = "development"

[config.expected_owner]
required = false
type = "string"
default = ""

[config.auto_switch_account]
required = false
type = "boolean"
default = false

[provides]
skills = [{ id = "gitlab-merge-workflow", source = "bundled" }]
commands = [{ id = "mr-create", path = "commands/mr-create.md" }]

[provides.brief]
workflow_rules = [
    "Use a MR-based merge workflow; all changes to `{config.base_branch}` go through a merge request.",
    "VCS/MR provider: GitLab (glab CLI). Use glab for all MR operations.",
    "Do not push directly to `{config.base_branch}`; always open an MR from a feature branch.",
]

[[provides.docs]]
source = "README.md"
target = "ai-specs/recipes/gitlab-mr-flow/README.md"
