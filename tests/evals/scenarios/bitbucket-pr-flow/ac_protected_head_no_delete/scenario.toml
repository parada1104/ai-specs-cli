id = "ac_protected_head_no_delete"
recipe_id = "bitbucket-pr-flow"
prompt_file = "prompt.txt"
mode = "build"
description = "Protected head development: merge without --close-source-branch"
forbidden_path_globs = []
required_path_globs = ["ai-specs/eval-notes/merge-plan.md"]
required_content = [
  { path = "ai-specs/eval-notes/merge-plan.md", contains_any = ["bb pr merge", "protected"] },
]
forbidden_content = [
  { path = "ai-specs/eval-notes/merge-plan.md", contains_any = [
    "bb pr merge --strategy squash --close-source-branch",
    "git branch -D development",
  ] },
]
