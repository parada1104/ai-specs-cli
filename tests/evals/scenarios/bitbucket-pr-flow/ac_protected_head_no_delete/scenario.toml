id = "ac_protected_head_no_delete"
recipe_id = "bitbucket-pr-flow"
prompt_file = "prompt.txt"
mode = "build"
description = "Protected head development: merge without --close-source-branch"
forbidden_path_globs = []
required_path_globs = ["ai-specs/eval-notes/merge-plan.md"]
required_content = [
  { path = "ai-specs/eval-notes/merge-plan.md", contains_any = ["protected", "protegido", "protegida"] },
  { path = "ai-specs/eval-notes/merge-plan.md", contains_any = ["bb pr merge"] },
  { path = "ai-specs/eval-notes/merge-plan.md", contains_any = [
    "never pass --close-source-branch",
    "do not use --close-source-branch",
    "do not include --close-source-branch",
    "do not run --close-source-branch",
    "sin --close-source-branch",
    "without --close-source-branch",
    "no --close-source-branch",
    "must not be deleted",
    "no branch deletion",
    "no worktree cleanup",
    "no remote branch cleanup",
    "no cleanup",
    "sin cleanup",
    "no borrar",
    "no se borra",
    "no se elimina",
    "without deleting",
    "without closing",
  ] },
]
forbidden_command_lines = [
  { path = "ai-specs/eval-notes/merge-plan.md", starts_with = "bb pr merge", must_not_contain = "--close-source-branch" },
]
