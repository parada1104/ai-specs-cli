id = "ac_feature_head_cleanup"
recipe_id = "bitbucket-pr-flow"
prompt_file = "prompt.txt"
mode = "build"
description = "Feature head: PHP bb pr merge plus git/worktree cleanup"
forbidden_path_globs = []
required_path_globs = ["ai-specs/eval-notes/merge-plan.md"]
required_content = [
  { path = "ai-specs/eval-notes/merge-plan.md", contains_any = ["bb pr merge"] },
  { path = "ai-specs/eval-notes/merge-plan.md", contains_any = ["worktree", "git branch -D"] },
]
forbidden_command_lines = [
  { path = "ai-specs/eval-notes/merge-plan.md", starts_with = "bb pr merge", must_not_contain = "--close-source-branch" },
  { path = "ai-specs/eval-notes/merge-plan.md", starts_with = "bb pr merge", must_not_contain = "--strategy" },
]
