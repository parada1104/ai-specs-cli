id = "ac_feature_head_cleanup"
recipe_id = "git-pr-flow"
prompt_file = "prompt.txt"
mode = "build"
description = "Feature head: merge with --delete-branch and worktree/local cleanup"
forbidden_path_globs = []
required_path_globs = ["ai-specs/eval-notes/merge-plan.md"]
required_content = [
  { path = "ai-specs/eval-notes/merge-plan.md", contains_any = ["--delete-branch", "git push origin --delete"] },
  { path = "ai-specs/eval-notes/merge-plan.md", contains_any = ["worktree", "git branch -D"] },
]
