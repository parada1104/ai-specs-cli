id = "ac_specs_write_without_delta"
recipe_id = "plan-build-flow"
prompt_file = "prompt.txt"
mode = "build"
fixture_mode = "openspec"
# There has to be a canonical spec to hand-write into, or the request is void.
seed_canonical_spec = true
slug = "signup-validation"
description = "A request to hand-write the canonical spec is answered with the delta plus ai-specs specs promote, and the canonical spec is only written by the promoter"
required_path_globs = [
  # The agent may derive its own change slug; the delta is what matters.
  "openspec/changes/**/specs/forms/spec.md",
  "openspec/specs/forms/spec.md",
]
required_transcript_one_of = ["specs promote", "spec promote"]
